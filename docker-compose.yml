# Environnement de développement
# Usage : docker compose up -d --build

name: athena-dentaire-dev

services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: php-dev
    container_name: athena_dev_php
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - .:/var/www/html
      - composer_cache:/tmp/composer
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pgrep php-fpm > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - athena_dev

  nginx:
    image: nginx:1.27-alpine
    container_name: athena_dev_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8081}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
    networks:
      - athena_dev

  database:
    image: postgres:16-alpine
    container_name: athena_dev_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-athena}
      POSTGRES_USER: ${POSTGRES_USER:-athena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-athena}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-athena} -d ${POSTGRES_DB:-athena}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - athena_dev

  mailpit:
    image: axllent/mailpit:latest
    container_name: athena_dev_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8026}:8025"
      - "${MAILPIT_SMTP_PORT:-1026}:1025"
    networks:
      - athena_dev

volumes:
  db_data_dev:
  composer_cache:

networks:
  athena_dev:
    driver: bridge
