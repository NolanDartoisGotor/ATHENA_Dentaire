# Environnement de production
# Usage : docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

name: athena-dentaire-prod

services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: php-prod
    image: athena-dentaire-php:prod
    container_name: athena_prod_php
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - athena_prod
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: nginx-prod
    image: athena-dentaire-nginx:prod
    container_name: athena_prod_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      php:
        condition: service_started
    networks:
      - athena_prod
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  database:
    image: mysql:8.4
    container_name: athena_prod_database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data_mysql_prod:/var/lib/mysql
    networks:
      - athena_prod
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data_mysql_prod:

networks:
  athena_prod:
    driver: bridge
